<!-- Injected into <head> on every page via _quarto.yml (include-in-header).
     Three jobs: load fonts, replace the theme toggle, run the motion layer. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet">
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------------
     Theme toggle
     Quarto owns the actual theme switch (it swaps Bootstrap stylesheets and
     sets body.quarto-dark). Rather than fight it, we hide its toggle, render
     our own, forward clicks, and mirror the resulting state onto
     <html data-bs-theme> so styles.css tokens follow along.
     --------------------------------------------------------------------- */

  var SUN =
    '<svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';

  var MOON =
    '<svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M20.5 13.4A8.3 8.3 0 1 1 10.6 3.5a6.5 6.5 0 0 0 9.9 9.9z"/></svg>';

  function isDark() {
    return document.body.classList.contains("quarto-dark");
  }

  function syncTheme(button) {
    var dark = isDark();
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
    if (button) {
      button.innerHTML = dark ? SUN : MOON;
      button.setAttribute(
        "aria-label",
        dark ? "Switch to light mode" : "Switch to dark mode"
      );
    }
  }

  function initThemeToggle() {
    var native = document.querySelector("a.quarto-color-scheme-toggle");

    var button = document.createElement("button");
    button.id = "color-toggle";
    button.type = "button";

    if (native) {
      native.parentNode.insertBefore(button, native);
      button.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        native.click();
      });
    }

    syncTheme(button);

    // Quarto flips the body class; watch for it instead of guessing.
    new MutationObserver(function () {
      syncTheme(button);
    }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  }

  /* ---------------------------------------------------------------------
     Scroll reveal
     Content fades up once as it enters the viewport. Items inside the same
     grid are staggered slightly so a row doesn't pop in all at once.
     --------------------------------------------------------------------- */

  var REVEAL_SELECTOR = [
    ".intro",
    ".experience-card",
    ".education-card",
    ".project-card",
    ".feed-grid > .card",
    "main h2",
    "main form",
  ].join(",");

  function initReveal() {
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var targets = Array.prototype.slice.call(
      document.querySelectorAll(REVEAL_SELECTOR)
    );
    if (!targets.length) return;

    if (reduced || !("IntersectionObserver" in window)) {
      targets.forEach(function (el) {
        el.classList.add("is-visible", "reveal-done");
      });
      return;
    }

    // Stagger siblings within a shared parent.
    var seen = new Map();
    targets.forEach(function (el) {
      el.setAttribute("data-reveal", "");
      var parent = el.parentNode;
      var index = seen.get(parent) || 0;
      seen.set(parent, index + 1);
      if (index > 0) {
        el.style.setProperty("--reveal-delay", Math.min(index, 6) * 55 + "ms");
      }
    });

    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var el = entry.target;
          el.classList.add("is-visible");
          observer.unobserve(el);
          // Hand the element back to its normal hover transitions.
          window.setTimeout(function () {
            el.classList.add("reveal-done");
            el.style.removeProperty("--reveal-delay");
          }, 900);
        });
      },
      { rootMargin: "0px 0px -8% 0px", threshold: 0.08 }
    );

    targets.forEach(function (el) {
      observer.observe(el);
    });
  }

  /* ---------------------------------------------------------------------
     Header hairline appears only once the page has scrolled.
     --------------------------------------------------------------------- */

  function initHeaderState() {
    var header = document.querySelector("#quarto-header");
    if (!header) return;

    var ticking = false;
    function update() {
      header.classList.toggle("is-scrolled", window.scrollY > 8);
      ticking = false;
    }

    window.addEventListener(
      "scroll",
      function () {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      },
      { passive: true }
    );

    update();
  }

  document.addEventListener("DOMContentLoaded", function () {
    initThemeToggle();
    initReveal();
    initHeaderState();
  });
})();
</script>
